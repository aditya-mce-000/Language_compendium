<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeskFlow — Daily Work Tracker</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #2b2b26;
    --muted: #8a8578;
    --line: #e5e0d5;
    --accent: #b3541e;
    --accent-soft: #f7e8dd;
    --green: #3e7d4e;
    --green-soft: #e6f0e8;
    --red: #b3372e;
    --red-soft: #f9e5e3;
    --amber: #a5750f;
    --amber-soft: #f7efdb;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(43,43,38,.06), 0 8px 24px rgba(43,43,38,.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    background-image:
      linear-gradient(rgba(43,43,38,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(43,43,38,.025) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }

  /* Header */
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .logo {
    width: 44px; height: 44px; border-radius: 12px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px; box-shadow: var(--shadow);
  }
  .brand h1 { font-size: 22px; letter-spacing: -0.3px; }
  .brand p { font-size: 13px; color: var(--muted); }
  .clock { text-align: right; }
  .clock .time { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock .date { font-size: 13px; color: var(--muted); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .stat .num { font-size: 28px; font-weight: 700; }
  .stat .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 2px; }
  .stat.due .num { color: var(--amber); }
  .stat.overdue .num { color: var(--red); }
  .stat.done .num { color: var(--green); }

  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  /* Form card */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px;
  }
  .card h2 { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; font-family: inherit; background: #fdfcf9; color: var(--ink);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    font-family: inherit; transition: transform .1s, background .15s;
  }
  .btn:hover { background: #9c4a1a; }
  .btn:active { transform: scale(.98); }

  /* Filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); font-size: 13px; cursor: pointer; font-family: inherit;
    color: var(--muted); transition: all .15s;
  }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Task list */
  .task {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
    display: flex; gap: 14px; align-items: flex-start;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .task.done { opacity: .6; }
  .task.done .t-title { text-decoration: line-through; }
  .check {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line);
    background: #fff; cursor: pointer; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; transition: all .15s;
  }
  .check:hover { border-color: var(--green); }
  .task.done .check { background: var(--green); border-color: var(--green); }
  .check::after { content: ""; }
  .task.done .check::after { content: "✓"; }
  .t-body { flex: 1; min-width: 0; }
  .t-title { font-size: 15px; font-weight: 600; }
  .t-notes { font-size: 13px; color: var(--muted); margin-top: 3px; white-space: pre-wrap; }
  .t-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .tag {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    letter-spacing: .03em;
  }
  .tag.high { background: var(--red-soft); color: var(--red); }
  .tag.medium { background: var(--amber-soft); color: var(--amber); }
  .tag.low { background: var(--green-soft); color: var(--green); }
  .tag.deadline { background: #eeece6; color: var(--muted); }
  .tag.deadline.soon { background: var(--amber-soft); color: var(--amber); }
  .tag.deadline.late { background: var(--red-soft); color: var(--red); }
  .t-del {
    border: none; background: none; cursor: pointer; color: var(--muted);
    font-size: 16px; padding: 4px 8px; border-radius: 8px; flex-shrink: 0;
  }
  .t-del:hover { background: var(--red-soft); color: var(--red); }
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  /* Toasts */
  #toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; max-width: 340px; }
  .toast {
    background: var(--ink); color: var(--bg); padding: 14px 16px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 14px;
    animation: toastIn .3s ease; display: flex; gap: 10px; align-items: flex-start;
  }
  .toast.warn { background: var(--amber); color: #fff; }
  .toast.late { background: var(--red); color: #fff; }
  .toast.ok { background: var(--green); color: #fff; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  .progress-bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .progress-bar > div { height: 100%; background: var(--green); border-radius: 99px; transition: width .4s ease; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🗂️</div>
      <div>
        <h1>DeskFlow</h1>
        <p>Your daily office work tracker</p>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="clock">--:--</div>
      <div class="date" id="dateLine">—</div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="stTotal">0</div><div class="lbl">Total tasks</div></div>
    <div class="stat done"><div class="num" id="stDone">0</div><div class="lbl">Completed</div></div>
    <div class="stat due"><div class="num" id="stSoon">0</div><div class="lbl">Due soon</div></div>
    <div class="stat overdue"><div class="num" id="stLate">0</div><div class="lbl">Overdue</div></div>
  </div>

  <div class="layout">
    <div class="card">
      <h2>➕ New task</h2>
      <form id="taskForm">
        <div class="field">
          <label for="fTitle">Task title</label>
          <input id="fTitle" type="text" placeholder="e.g. Send weekly report" required maxlength="120" />
        </div>
        <div class="field">
          <label for="fNotes">Notes (optional)</label>
          <textarea id="fNotes" placeholder="Details, links, people involved..."></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label for="fDeadline">Deadline</label>
            <input id="fDeadline" type="datetime-local" required />
          </div>
          <div class="field">
            <label for="fPriority">Priority</label>
            <select id="fPriority">
              <option value="high">🔴 High</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>
        </div>
        <button class="btn" type="submit">Add to my desk</button>
      </form>
      <div class="progress-bar" title="Completion progress"><div id="progFill" style="width:0%"></div></div>
    </div>

    <div>
      <div class="filters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="open">Open</button>
        <button class="chip" data-filter="done">Done</button>
        <button class="chip" data-filter="late">Overdue</button>
        <button class="chip" id="btnClearDone" style="margin-left:auto">Clear completed</button>
      </div>
      <div id="taskList"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
(function () {
  "use strict";

  /* ---------- Storage: persist user data in the browser (localStorage) ---------- */
  var STORAGE_KEY = "deskflow.tasks.v1";
  var NOTIFIED_KEY = "deskflow.notified.v1";

  function loadTasks() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }
  function loadNotified() {
    try {
      var raw = localStorage.getItem(NOTIFIED_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveNotified() {
    localStorage.setItem(NOTIFIED_KEY, JSON.stringify(notified));
  }

  var tasks = loadTasks();
  var notified = loadNotified();
  var currentFilter = "all";

  /* ---------- Elements ---------- */
  var form = document.getElementById("taskForm");
  var listEl = document.getElementById("taskList");
  var toastsEl = document.getElementById("toasts");

  /* ---------- Clock ---------- */
  function tickClock() {
    var now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    document.getElementById("dateLine").textContent =
      now.toLocaleDateString([], { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- Toasts / deadline notifications ---------- */
  function toast(msg, kind) {
    var el = document.createElement("div");
    el.className = "toast " + (kind || "");
    el.textContent = msg;
    toastsEl.appendChild(el);
    setTimeout(function () {
      el.style.opacity = "0";
      el.style.transition = "opacity .3s";
      setTimeout(function () { el.remove(); }, 300);
    }, 5000);
  }

  // Ask for browser Notification permission once (graceful if denied)
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
  function browserNotify(title, body) {
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification(title, { body: body }); } catch (e) {}
    }
  }

  /* ---------- Deadline checking ---------- */
  var SOON_MS = 60 * 60 * 1000; // "due soon" = within 1 hour

  function deadlineState(t) {
    if (t.done || !t.deadline) return "none";
    var diff = new Date(t.deadline).getTime() - Date.now();
    if (diff < 0) return "late";
    if (diff <= SOON_MS) return "soon";
    return "none";
  }

  function checkDeadlines() {
    var changed = false;
    tasks.forEach(function (t) {
      if (t.done || !t.deadline) return;
      var diff = new Date(t.deadline).getTime() - Date.now();
      if (diff < 0 && !notified[t.id + ":late"]) {
        notified[t.id + ":late"] = true; changed = true;
        toast("⚠️ Overdue: " + t.title, "late");
        browserNotify("Task overdue", t.title);
      } else if (diff > 0 && diff <= SOON_MS && !notified[t.id + ":soon"]) {
        notified[t.id + ":soon"] = true; changed = true;
        var mins = Math.max(1, Math.round(diff / 60000));
        toast("⏰ Due in ~" + mins + " min: " + t.title, "warn");
        browserNotify("Deadline approaching", t.title + " — due in about " + mins + " min");
      }
    });
    if (changed) saveNotified();
    render(); // refresh countdown labels
  }

  /* ---------- Rendering ---------- */
  function fmtDeadline(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " +
           d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function countdownText(iso) {
    var diff = new Date(iso).getTime() - Date.now();
    if (diff < 0) {
      var ago = Math.abs(diff);
      if (ago < 3600000) return "overdue by " + Math.round(ago / 60000) + "m";
      if (ago < 86400000) return "overdue by " + Math.round(ago / 3600000) + "h";
      return "overdue by " + Math.round(ago / 86400000) + "d";
    }
    if (diff < 3600000) return "due in " + Math.max(1, Math.round(diff / 60000)) + "m";
    if (diff < 86400000) return "due in " + Math.round(diff / 3600000) + "h";
    return "due in " + Math.round(diff / 86400000) + "d";
  }

  function render() {
    var filtered = tasks.filter(function (t) {
      if (currentFilter === "open") return !t.done;
      if (currentFilter === "done") return t.done;
      if (currentFilter === "late") return deadlineState(t) === "late";
      return true;
    });

    // sort: open first (by deadline), done last
    filtered.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return new Date(a.deadline) - new Date(b.deadline);
    });

    listEl.innerHTML = "";
    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty"><div class="big">☕</div>' +
        (tasks.length === 0 ? "No tasks yet — add your first task for today." : "Nothing matches this filter.") + "</div>";
    }

    filtered.forEach(function (t) {
      var state = deadlineState(t);
      var el = document.createElement("div");
      el.className = "task" + (t.done ? " done" : "");

      var dlClass = state === "late" ? "late" : state === "soon" ? "soon" : "";
      el.innerHTML =
        '<button class="check" aria-label="Toggle done"></button>' +
        '<div class="t-body">' +
          '<div class="t-title"></div>' +
          (t.notes ? '<div class="t-notes"></div>' : "") +
          '<div class="t-meta">' +
            '<span class="tag ' + t.priority + '">' + t.priority.toUpperCase() + '</span>' +
            '<span class="tag deadline ' + dlClass + '">🕒 ' + fmtDeadline(t.deadline) +
              (t.done ? "" : " · " + countdownText(t.deadline)) + '</span>' +
          '</div>' +
        '</div>' +
        '<button class="t-del" aria-label="Delete task">✕</button>';

      el.querySelector(".t-title").textContent = t.title;
      if (t.notes) el.querySelector(".t-notes").textContent = t.notes;

      el.querySelector(".check").addEventListener("click", function () {
        t.done = !t.done;
        if (t.done) toast("✅ Done: " + t.title, "ok");
        saveTasks(); render();
      });
      el.querySelector(".t-del").addEventListener("click", function () {
        tasks = tasks.filter(function (x) { return x.id !== t.id; });
        saveTasks(); render();
      });

      listEl.appendChild(el);
    });

    // stats
    var open = tasks.filter(function (t) { return !t.done; });
    document.getElementById("stTotal").textContent = tasks.length;
    document.getElementById("stDone").textContent = tasks.length - open.length;
    document.getElementById("stSoon").textContent = open.filter(function (t) { return deadlineState(t) === "soon"; }).length;
    document.getElementById("stLate").textContent = open.filter(function (t) { return deadlineState(t) === "late"; }).length;
    document.getElementById("progFill").style.width =
      tasks.length ? Math.round(((tasks.length - open.length) / tasks.length) * 100) + "%" : "0%";
  }

  /* ---------- Events ---------- */
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var title = document.getElementById("fTitle").value.trim();
    var notes = document.getElementById("fNotes").value.trim();
    var deadline = document.getElementById("fDeadline").value;
    var priority = document.getElementById("fPriority").value;
    if (!title || !deadline) return;

    tasks.push({
      id: "t" + Date.now() + Math.random().toString(36).slice(2, 7),
      title: title,
      notes: notes,
      deadline: deadline,
      priority: priority,
      done: false,
      createdAt: new Date().toISOString()
    });
    saveTasks();
    form.reset();
    toast("📌 Task added to your desk");
    render();
  });

  document.querySelectorAll(".chip[data-filter]").forEach(function (chip) {
    chip.addEventListener("click", function () {
      document.querySelectorAll(".chip[data-filter]").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      currentFilter = chip.getAttribute("data-filter");
      render();
    });
  });

  document.getElementById("btnClearDone").addEventListener("click", function () {
    var before = tasks.length;
    tasks = tasks.filter(function (t) { return !t.done; });
    if (tasks.length !== before) {
      saveTasks();
      toast("🧹 Cleared completed tasks");
      render();
    }
  });

  /* ---------- Boot ---------- */
  render();
  checkDeadlines();
  setInterval(checkDeadlines, 30000); // check every 30 seconds
})();
</script>
</body>
</html>
